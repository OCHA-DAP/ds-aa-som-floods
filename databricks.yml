# Databricks Asset Bundle — ds-aa-som-floods
#
# One job: download_glofas_reforecast_box — long-running one-shot download
# of the GloFAS v4.2 reforecast readiness band (leads 8-12 d) for the SOM
# all-stations box, streamed to blob. Mirrors the ds-aa-nga-flooding
# download_glofas_reforecast_country job.
#
# Common commands:
#   databricks bundle validate -t dev -p DEFAULT
#   databricks bundle deploy   -t dev -p DEFAULT
#   databricks bundle run download_glofas_reforecast_box -t dev -p DEFAULT
#
# Smoke test (one year, one month):
#   databricks bundle run download_glofas_reforecast_box -t dev -p DEFAULT \
#       --params "start_year=2020,end_year=2020,months=10"

bundle:
  name: ds-aa-som-floods

variables:
  git_branch:
    description: Repo branch the job pulls source from
    default: main

resources:
  jobs:

    download_glofas_reforecast_box:
      name: Download GloFAS Reforecast Box (SOM, leads 8-12)
      description: >
        Download the GloFAS v4.2 reforecast for the Somalia all-stations box
        at leads 8-12 days (readiness band) from EWDS and stream chunks to
        blob under ds-aa-som-floods/raw/glofas/raw/reforecast_som_ext_lead8_12/.
        Idempotent — skips chunks already in blob. Expected runtime: hours-days.

      permissions:
        - group_name: dsci
          level: CAN_MANAGE

      git_source:
        git_url: https://github.com/OCHA-DAP/ds-aa-som-floods.git
        git_provider: gitHub
        git_branch: ${var.git_branch}

      # No schedule — trigger manually via UI or `databricks bundle run`.
      max_concurrent_runs: 1

      parameters:
        - name: leads
          default: "8,9,10,11,12"
        - name: start_year
          default: "2003"
        - name: end_year
          default: "2023"
        - name: months
          default: "03,04,05,06,10,11,12"
        - name: dir_suffix
          default: "_lead8_12"
        - name: blob_sync
          default: "true"

      job_clusters:
        - job_cluster_key: main
          new_cluster:
            # Job Compute policy injects CDSAPI_KEY + DSCI_AZ_* from the
            # dsci secret scope. The EWDS URL is hardcoded in
            # src/datasources/glofas.py, so the policy's CDSAPI_URL default
            # (plain CDS) does not matter here.
            policy_id: "000C79D951EAF0D6"
            apply_policy_default_values: true
            num_workers: 1

      tasks:
        - task_key: download
          job_cluster_key: main
          libraries:
            - pypi:
                package: cdsapi
            - pypi:
                package: ocha-stratus
            - pypi:
                package: xarray
          spark_python_task:
            python_file: pipelines/download_glofas_reforecast_box.py
            source: GIT
            parameters:
              - "--leads"
              - "{{job.parameters.leads}}"
              - "--start-year"
              - "{{job.parameters.start_year}}"
              - "--end-year"
              - "{{job.parameters.end_year}}"
              - "--months"
              - "{{job.parameters.months}}"
              - "--dir-suffix"
              - "{{job.parameters.dir_suffix}}"
              - "--blob-sync"
              - "{{job.parameters.blob_sync}}"

targets:
  dev:
    mode: development

  prod:
    mode: production
    run_as:
      user_name: adm.tdowning@global.un.org
