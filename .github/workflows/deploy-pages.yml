name: Deploy pages site to GitHub Pages

# Publishes the landing page and the trigger-analysis report (pages/) as this repo's one
# Pages site, per the team convention (ds-knowledge-base methods/static-data-apps.md,
# "One repo, one Pages site"). Template: OCHA-DAP/ds-seas5-skill (hand-edited-cards
# variant — two cards do not need a manifest; the manifest-driven variant lives in
# OCHA-DAP/ds-storm-impact-harmonisation). No build step, no Python, no credentials.
#
# The repo is public, so the site is public at https://ocha-dap.github.io/ds-aa-som-floods/.
#
# The monitoring pipeline (monitoring.yml, from 12:00 UTC) pushes status.json + latest.png to
# the orphan `monitoring-status` branch; this workflow runs when that one completes and
# overlays them into pages/monitoring/, so the public status page follows the data directly.
#
# workflow_dispatch exists for manual redeploys (including from a branch, pre-merge).
# configure-pages with enablement: true creates/switches the site to workflow builds on
# first run.

on:
  push:
    branches: [main]
    paths: ["pages/**", ".github/workflows/deploy-pages.yml"]
  workflow_run:
    workflows: ["Monitor Somalia riverine flooding"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Overlay the monitoring status data (orphan branch, may not exist yet)
        run: |
          git fetch --depth 1 origin monitoring-status || true
          git checkout origin/monitoring-status -- pages/monitoring/status.json pages/monitoring/latest.png 2>/dev/null || true
          ls -la pages/monitoring/
      - name: Assemble site (landing at /, report at /trigger/)
        run: |
          mkdir -p site
          rsync -a pages/ site/
          test -f site/index.html && test -f site/trigger/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
